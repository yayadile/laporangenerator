# Satu service berbasis Docker (pandoc + XeTeX sudah ada di image).
# Port tidak di-hardcode: Render meng-inject env PORT dan aplikasi
# (gunicorn di Dockerfile / app.py) membaca dari situ.
services:
  - type: web
    name: report-generator-service
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
